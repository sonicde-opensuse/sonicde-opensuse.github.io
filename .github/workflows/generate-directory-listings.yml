name: Generate Directory Listings for All Folders

on:
  push:
    branches: [ main ]  # or whatever your default branch is

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate index.html recursively for entire repo
        uses: gacts/directory-listing@v1
        with:
          target: .               # ← This is key: "." means root + recursive through all subfolders
          ignore: |               # Optional: skip things you don't want listed
            .git/**
            .github/**
            **/index.html         # Avoid overwriting if you add custom ones later
            node_modules/**
          show-hidden: false      # Set true if you want dotfiles shown
          overwrite: true         # Regenerate even if index.html exists
          footer: |               # Optional custom footer
            <p>Generated by GitHub Action • <a href="https://github.com/sonicde-opensuse/sonicde-opensuse.github.io">Repo</a></p>

      - name: Commit and push generated index.html files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Auto-generate directory listings for GitHub Pages
          file_pattern: "**/index.html"  # Only commit the generated ones
